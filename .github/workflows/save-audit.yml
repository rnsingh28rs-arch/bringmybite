name: Fable Save Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/save-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit panel save paths
        run: |
          echo '=== ADMIN SAVE/HANDLER LINES ==='
          grep -nEi 'save|update|submit|onSubmit|onClick' src/components/panels/AdminPanel.tsx | head -n 250 || true
          echo '=== MANAGER SAVE/HANDLER LINES ==='
          grep -nEi 'save|update|submit|onSubmit|onClick' src/components/panels/ManagerPanel.tsx | head -n 250 || true
          echo '=== CHEF SAVE/HANDLER LINES ==='
          grep -nEi 'save|update|submit|onSubmit|onClick' src/components/panels/ChefPanel.tsx | head -n 250 || true
          echo '=== DADMIN SAVE/HANDLER LINES ==='
          grep -nEi 'save|update|submit|onSubmit|onClick' src/components/panels/DAdminDesigner.tsx | head -n 250 || true
