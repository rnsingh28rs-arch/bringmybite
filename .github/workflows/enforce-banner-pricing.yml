name: Enforce Banner Pricing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enforce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Replace customer pricing with Banner source
        shell: python
        run: |
          from pathlib import Path
          import re

          # AppContext: project Banner fields into the existing pricing interface so
          # every existing customer component receives Banner-controlled values.
          p=Path('src/context/AppContext.tsx'); s=p.read_text()
          old="const vegMenu=cms.menus['VEG CLASSIC'],eggMenu=cms.menus['EGG DELIGHT'],nonVegMenu=cms.menus['NON-VEG CLUB'],pricing=cms.pricing;"
          new="""const vegMenu=cms.menus['VEG CLASSIC'],eggMenu=cms.menus['EGG DELIGHT'],nonVegMenu=cms.menus['NON-VEG CLUB'];
          const bannerPrice=(v:string|number|undefined)=>{const n=Number(String(v??'').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:0;};
          const vegBanner=cms.banners.find(b=>b.active&&b.package_key==='VEG CLASSIC');
          const eggBanner=cms.banners.find(b=>b.active&&b.package_key==='EGG DELIGHT');
          const nonVegBanner=cms.banners.find(b=>b.active&&b.package_key==='NON-VEG CLUB');
          const vegThali=cms.banners.find(b=>b.active&&b.thali_key==='veg');
          const eggThali=cms.banners.find(b=>b.active&&b.thali_key==='egg');
          const nonVegThali=cms.banners.find(b=>b.active&&b.thali_key==='non-veg');
          const pricing:PlanPricing={vegMonthly:bannerPrice(vegBanner?.highlight_price),eggMonthly:bannerPrice(eggBanner?.highlight_price),nonVegMonthly:bannerPrice(nonVegBanner?.highlight_price),vegThaliInstant:bannerPrice(vegThali?.thali_rate),eggThaliInstant:bannerPrice(eggThali?.thali_rate),nonVegThaliInstant:bannerPrice(nonVegThali?.thali_rate)};"""
          if old in s: s=s.replace(old,new,1)
          else: raise SystemExit('AppContext pricing anchor not found')
          p.write_text(s)

          # Registration: remove duration multiplier/discount and read exact Banner price.
          p=Path('src/components/customer/RegistrationModal.tsx'); s=p.read_text()
          if "import { useCms } from '../../cms/CmsContext';" not in s:
              s=s.replace("import { PaymentDetailsCard } from '../common/PaymentDetailsCard';","import { PaymentDetailsCard } from '../common/PaymentDetailsCard';\nimport { useCms } from '../../cms/CmsContext';")
          if 'const { banners } = useCms();' not in s:
              s=s.replace('export const RegistrationModal: React.FC = () => {','export const RegistrationModal: React.FC = () => {\n  const { banners } = useCms();')
          s=re.sub(r"\n  // Calculate monthly & total price\n.*?\n  const getPackageCode =", "\n  const selectedBanner=banners.find((b)=>b.active&&b.package_key===packageType);\n  const configuredAmount=Number(String(selectedBanner?.highlight_price||'').replace(/[^0-9.]/g,''))||0;\n\n  const getPackageCode =", s, count=1, flags=re.S)
          s=re.sub(r'const totalAmountToPay = .*?;', 'const totalAmountToPay = configuredAmount;', s, count=1)
          p.write_text(s)

          # Renewal: exact Banner price, no duration multiplier or discount.
          p=Path('src/components/customer/RenewalModal.tsx'); s=p.read_text()
          if "import { useCms } from '../../cms/CmsContext';" not in s:
              s=s.replace("import React, { useState } from 'react';","import React, { useState } from 'react';\nimport { useCms } from '../../cms/CmsContext';")
          if 'const { banners } = useCms();' not in s:
              s=s.replace('export const RenewalModal: React.FC = () => {','export const RenewalModal: React.FC = () => {\n  const { banners } = useCms();')
          s=re.sub(r"\n  const basePrice =.*?\n  const totalRenewalAmount = Math\.round\(basePrice \* multiplier \* discountFactor\);", "\n  const selectedBanner=banners.find((b)=>b.active&&b.package_key===activeSub.packageType);\n  const totalRenewalAmount=Number(String(selectedBanner?.highlight_price||'').replace(/[^0-9.]/g,''))||0;", s, count=1, flags=re.S)
          p.write_text(s)

          # InstantOrderModal: ensure the final submitted/displayed price is the Banner rate,
          # and do not multiply it by quantity.
          p=Path('src/components/customer/InstantOrderModal.tsx'); s=p.read_text()
          if "import { useCms } from '../../cms/CmsContext';" not in s:
              s=s.replace("import { PaymentMethod } from '../../types';","import { PaymentMethod } from '../../types';\nimport { useCms } from '../../cms/CmsContext';")
          if 'const { banners } = useCms();' not in s:
              s=s.replace('export const InstantOrderModal: React.FC = () => {','export const InstantOrderModal: React.FC = () => {\n  const { banners } = useCms();')
          # Replace the quantity multiplication wherever present.
          s=re.sub(r'const totalAmount = unitPrice \* quantity;', 'const totalAmount = unitPrice;', s)
          # Replace unitPrice ternary based on pricing with Banner lookup when anchor exists.
          s=re.sub(r'const unitPrice =\s*\n\s*thaliType === \'veg\'\s*\n\s*\? pricing\.vegThaliInstant\s*\n\s*: thaliType === \'egg\'\s*\n\s*\? pricing\.eggThaliInstant\s*\n\s*: pricing\.nonVegThaliInstant;', "const configuredRate=banners.find((b)=>b.active&&b.thali_key===thaliType)?.thali_rate||'';\n  const unitPrice=Number(String(configuredRate).replace(/[^0-9.]/g,''))||0;", s, count=1)
          p.write_text(s)

      - name: Verify no legacy customer pricing calculations
        run: |
          ! grep -R "pricing\.vegMonthly\|pricing\.eggMonthly\|pricing\.nonVegMonthly\|pricing\.vegThaliInstant\|pricing\.eggThaliInstant\|pricing\.nonVegThaliInstant" src/components/customer/RegistrationModal.tsx src/components/customer/RenewalModal.tsx src/components/customer/InstantOrderModal.tsx
          npm run lint
          npm test
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet || git commit -m 'fix: make banner the sole customer pricing source'
          git push origin main
