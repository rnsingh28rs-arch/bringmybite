name: Fix order lifecycle
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/utils/orderLifecycle.mjs'
      - 'tests/orderLifecycle.test.mjs'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Wire lifecycle controls into Admin order actions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/components/panels/AdminPanel.tsx';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes("import { getOrderActions } from '../../utils/orderLifecycle.mjs';")) {
            s = s.replace("import { whatsappLink } from '../../utils/phone';", "import { whatsappLink } from '../../utils/phone';\nimport { getOrderActions } from '../../utils/orderLifecycle.mjs';");
          }
          const old = "const action=async(order:StoredOrder,next:StoredOrder['status'])=>{const verified=next==='Approved'||next==='Preparing'||next==='Dispatched'||next==='Delivered';await updateStoredOrder(order.id,{status:next,paymentStatus:verified?'Verified':next==='Declined'?'Rejected':order.paymentStatus});";
          const replacement = "const action=async(order:StoredOrder,next:StoredOrder['status'])=>{const allowed=next==='Declined'||getOrderActions(order.status,'admin').includes(next);if(!allowed)return;const verified=next==='Approved'||next==='Preparing'||next==='Dispatched'||next==='Delivered';await updateStoredOrder(order.id,{status:next,paymentStatus:verified?'Verified':next==='Declined'?'Rejected':order.paymentStatus});";
          if (s.includes(old)) s = s.replace(old, replacement);
          else throw new Error('Expected Admin order action block was not found');
          fs.writeFileSync(p, s);
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/panels/AdminPanel.tsx
          git commit -m 'fix: wire order lifecycle actions' || echo 'No changes to commit'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-order-lifecycle.yml
          git commit -m 'chore: remove temporary lifecycle workflow'
          git push
