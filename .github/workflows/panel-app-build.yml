name: Panel App Build
on:
  pull_request:
    paths:
      - 'panel-app/**'
      - '.github/workflows/panel-app-build.yml'
  push:
    branches: ['feature/separate-panel-app-rider']
    paths:
      - 'panel-app/**'
      - '.github/workflows/panel-app-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel-app/package.json
      - run: npm install
      - run: npm run build
