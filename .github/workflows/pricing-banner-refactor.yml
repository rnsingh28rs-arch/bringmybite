name: Pricing Wiring Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pricing-banner-refactor.yml'

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pricing wiring regression test
        run: node --test tests/livePricingWiring.test.mjs
