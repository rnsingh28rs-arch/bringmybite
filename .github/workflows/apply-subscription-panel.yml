name: Apply subscription activity panel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply panel wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/panels/AdminPanel.tsx')
          s = p.read_text()
          old_import = "import { InventoryPaymentApprovalPanel } from './InventoryPaymentApprovalPanel';"
          new_import = old_import + "\nimport { SubscriptionActivityPanel } from './SubscriptionActivityPanel';"
          if new_import not in s:
              if old_import not in s: raise SystemExit('AdminPanel import marker not found')
              s = s.replace(old_import, new_import, 1)
          marker = "{activeAdminTab === 'subscriptions' && <div className=\"bg-white p-5 rounded-2xl border\">"
          replacement = "{activeAdminTab === 'subscriptions' && <div className=\"space-y-5\"><SubscriptionActivityPanel subscriptions={subscriptions} /><div className=\"bg-white p-5 rounded-2xl border\">"
          if '<SubscriptionActivityPanel subscriptions={subscriptions} />' not in s:
              if marker not in s: raise SystemExit('Subscription tab marker not found')
              s = s.replace(marker, replacement, 1)
              # Close the wrapper immediately after the existing subscription directory block.
              target = "</div></div>}\n    {activeAdminTab === 'oversight'"
              if target not in s: raise SystemExit('Subscription tab closing marker not found')
              s = s.replace(target, "</div></div></div>}\n    {activeAdminTab === 'oversight'", 1)
          p.write_text(s)
          PY
      - name: Typecheck
        run: |
          npm ci --ignore-scripts
          npm run lint
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/panels/AdminPanel.tsx
          git rm .github/workflows/apply-subscription-panel.yml
          git commit -m 'Add separate subscription activity tracking'
          git push
