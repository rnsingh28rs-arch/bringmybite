name: Fable Save Repair 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/save-repair2.yml'
      - 'src/components/panels/ChefPanel.tsx'
      - 'src/components/panels/ManagerPanel.tsx'
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip save repair 2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair async save/update actions
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/panels/ChefPanel.tsx'); s=p.read_text()
          s=s.replace('const handleCreateIndent = (e: React.FormEvent) => {','const handleCreateIndent = async (e: React.FormEvent) => {')
          s=s.replace('    addChefIndent({\n      ingredientName:', '    await addChefIndent({\n      ingredientName:', 1)
          s=s.replace("onClick={() => updateInstantOrderStatus(ord.id, 'Ready')}", "onClick={() => void updateInstantOrderStatus(ord.id, 'Ready').catch((error) => alert(error instanceof Error ? error.message : 'Unable to save order status.'))}")
          s=s.replace("onClick={() => updateInstantOrderStatus(ord.id, 'Dispatched')}", "onClick={() => void updateInstantOrderStatus(ord.id, 'Dispatched').catch((error) => alert(error instanceof Error ? error.message : 'Unable to save order status.'))}")
          s=s.replace("onClick={() => updateInstantOrderStatus(ord.id, 'Delivered')}", "onClick={() => void updateInstantOrderStatus(ord.id, 'Delivered').catch((error) => alert(error instanceof Error ? error.message : 'Unable to save order status.'))}")
          p.write_text(s)
          p=Path('src/components/panels/ManagerPanel.tsx'); s=p.read_text()
          s=s.replace("onClick={() => updateInventoryQuantity(item.id, -5)}", "onClick={() => void updateInventoryQuantity(item.id, -5).catch((error) => alert(error instanceof Error ? error.message : 'Unable to save inventory change.'))}")
          s=s.replace("onClick={() => updateInventoryQuantity(item.id, 5)}", "onClick={() => void updateInventoryQuantity(item.id, 5).catch((error) => alert(error instanceof Error ? error.message : 'Unable to save inventory change.'))}")
          s=s.replace("onClick={() => updateInventoryQuantity(item.id, 25)}", "onClick={() => void updateInventoryQuantity(item.id, 25).catch((error) => alert(error instanceof Error ? error.message : 'Unable to save inventory change.'))}")
          s=s.replace("onClick={() => updateChefIndentStatus(indent.id, 'Approved')}", "onClick={() => void updateChefIndentStatus(indent.id, 'Approved').catch((error) => alert(error instanceof Error ? error.message : 'Unable to save indent status.'))}")
          s=s.replace("onClick={() => updateChefIndentStatus(indent.id, 'Purchased')}", "onClick={() => void updateChefIndentStatus(indent.id, 'Purchased').catch((error) => alert(error instanceof Error ? error.message : 'Unable to save indent status.'))}")
          p.write_text(s)
      - name: Verify tests and build
        run: |
          npm test
          npm run build
          grep -q 'const handleCreateIndent = async' src/components/panels/ChefPanel.tsx
          grep -q 'await addChefIndent' src/components/panels/ChefPanel.tsx
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/save-repair2.yml
          git rm .github/workflows/save-repair2.yml
          git commit -m 'fix: await chef and manager save actions [skip save repair 2]'
          git pull --rebase origin main
          git push origin main
