name: Fable Save Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/save-repair.yml'
      - 'src/components/panels/**'
      - 'src/cms/**'
      - 'src/utils/**'
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip save repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Repair save handlers and pricing tab
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/components/panels/DAdminDesigner.tsx'); s=p.read_text()
          s=s.replace(', IndianRupee','')
          s=s.replace("['pricing','Pricing',IndianRupee], ",'')
          s=s.replace("        {tab === 'pricing' && <Pricing cms={cms} flash={flash} />}\n",'')
          s=s.replace("import { CalculatorWidget } from '../common/CalculatorWidget';\n",'')
          s=s.replace("      <CalculatorWidget />\n",'')
          s=re.sub(r'\nfunction Pricing\(.*?\nfunction Registration\(', '\nfunction Registration(', s, flags=re.S)
          s=s.replace("    ['Pricing records', Object.keys(cms.pricing).length, 'Used everywhere in the app']\n",'')
          p.write_text(s)
          p=Path('src/components/panels/ManagerPanel.tsx'); s=p.read_text()
          s=s.replace('const handleSavePricing = (e: React.FormEvent) => {','const handleSavePricing = async (e: React.FormEvent) => {')
          s=s.replace('    updatePricing({\n      vegMonthly:', '    await updatePricing({\n      vegMonthly:', 1)
          s=s.replace('const handleAddNewInventory = (e: React.FormEvent) => {','const handleAddNewInventory = async (e: React.FormEvent) => {')
          s=s.replace('    addInventoryItem({\n      name:', '    await addInventoryItem({\n      name:', 1)
          s=s.replace('const handleSaveMenuSchedule = (e: React.FormEvent) => {','const handleSaveMenuSchedule = async (e: React.FormEvent) => {')
          s=s.replace('    updateMenuItem(editPackage, editDay, editMeal, {', '    await updateMenuItem(editPackage, editDay, editMeal, {', 1)
          p.write_text(s)
          p=Path('src/cms/supabaseRest.ts'); s=p.read_text()
          s=s.replace("if(!Number.isInteger(value)) throw new Error(`Pricing value for ${(row as any).key} must be a whole number.`);", "if(!Number.isFinite(value)) throw new Error(`Pricing value for ${(row as any).key} must be a valid number.`);")
          p.write_text(s)
          p=Path('src/components/panels/StaffFinancePanel.tsx'); s=p.read_text()
          old="const save=async()=>{if(!draft.name.trim())return alert('Enter staff name.'); await saveStaffSalary({...draft,name:draft.name.trim(),updatedAt:new Date().toISOString()}); setDraft(blank()); await load();};"
          new="const save=async()=>{if(!draft.name.trim())return alert('Enter staff name.'); try{await saveStaffSalary({...draft,name:draft.name.trim(),updatedAt:new Date().toISOString()}); setDraft(blank()); await load(); alert('Saved successfully.');}catch(error){alert(error instanceof Error?error.message:'Unable to save staff record.');}};"
          if old in s: s=s.replace(old,new)
          p.write_text(s)
      - name: Verify build and tests
        run: |
          npm test
          npm run build
          test "$(grep -o "\['pricing','Pricing'" src/components/panels/DAdminDesigner.tsx | wc -l)" -eq 0
          grep -q "const handleSavePricing = async" src/components/panels/ManagerPanel.tsx
          grep -q "await updatePricing" src/components/panels/ManagerPanel.tsx
          grep -q "Number.isFinite(value)" src/cms/supabaseRest.ts
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/save-repair.yml
          git rm .github/workflows/save-repair.yml
          git commit -m 'fix: make panel saves await persistence [skip save repair]'
          git pull --rebase origin main
          git push origin main
