name: Definitive Banner Price Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-banner-prices-now.yml'
      - 'src/context/AppContext.tsx'
      - 'src/cms/CmsContext.tsx'
      - 'src/components/customer/**'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Make Banner the single source of truth
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)

          # The existing Banner rows already hold the authoritative values:
          # highlight_price for subscriptions and thali_rate for Instant Thali.
          # Project those Banner values through AppContext so all customer
          # components consuming `pricing` receive the Banner values.
          p = Path('src/context/AppContext.tsx')
          s = read(p)
          old = "const vegMenu=cms.menus['VEG CLASSIC'],eggMenu=cms.menus['EGG DELIGHT'],nonVegMenu=cms.menus['NON-VEG CLUB'],pricing=cms.pricing;"
          new = """const vegMenu=cms.menus['VEG CLASSIC'],eggMenu=cms.menus['EGG DELIGHT'],nonVegMenu=cms.menus['NON-VEG CLUB'];
          const bannerNumber=(value: string | number | undefined, fallback: number)=>{const n=Number(String(value??'').replace(/[^0-9.]/g,''));return Number.isFinite(n)&&n>=0?n:fallback;};
          const vegBanner=cms.banners.find(b=>b.active&&b.package_key==='VEG CLASSIC');
          const eggBanner=cms.banners.find(b=>b.active&&b.package_key==='EGG DELIGHT');
          const nonVegBanner=cms.banners.find(b=>b.active&&b.package_key==='NON-VEG CLUB');
          const vegThaliBanner=cms.banners.find(b=>b.active&&b.thali_key==='veg');
          const eggThaliBanner=cms.banners.find(b=>b.active&&b.thali_key==='egg');
          const nonVegThaliBanner=cms.banners.find(b=>b.active&&b.thali_key==='non-veg');
          const pricing:PlanPricing={
            vegMonthly:bannerNumber(vegBanner?.highlight_price,cms.pricing.vegMonthly),
            eggMonthly:bannerNumber(eggBanner?.highlight_price,cms.pricing.eggMonthly),
            nonVegMonthly:bannerNumber(nonVegBanner?.highlight_price,cms.pricing.nonVegMonthly),
            vegThaliInstant:bannerNumber(vegThaliBanner?.thali_rate,cms.pricing.vegThaliInstant),
            eggThaliInstant:bannerNumber(eggThaliBanner?.thali_rate,cms.pricing.eggThaliInstant),
            nonVegThaliInstant:bannerNumber(nonVegThaliBanner?.thali_rate,cms.pricing.nonVegThaliInstant)
          };"""
          if old not in s:
              raise SystemExit('AppContext pricing anchor changed; refusing unsafe edit')
          s=s.replace(old,new,1)
          write(p,s)

          # Instant order: displayed/product price comes from Banner; quantity
          # remains an order selection and must not rewrite the unit price.
          p=Path('src/components/customer/InstantOrderModal.tsx'); s=read(p)
          if "const { banners } = useCms();" not in s:
              if "import { useCms } from '../../cms/CmsContext';" not in s:
                  s=s.replace("import { PaymentMethod } from '../../types';","import { PaymentMethod } from '../../types';\nimport { useCms } from '../../cms/CmsContext';",1)
              s=s.replace("export const InstantOrderModal: React.FC = () => {","export const InstantOrderModal: React.FC = () => {\n  const { banners } = useCms();",1)
          s=s.replace("    pricing,\n", "", 1)
          s=re.sub(r"\n  const unitPrice =.*?\n  const thaliDisplayName =", "\n  const configuredRate = banners.find((b) => b.active && b.thali_key === thaliType)?.thali_rate || '';\n  const unitPrice = Number(String(configuredRate).replace(/[^0-9.]/g, '')) || 0;\n  const totalAmount = unitPrice;\n  const thaliDisplayName =", s, count=1, flags=re.S)
          s=re.sub(r"\n  const totalAmount = unitPrice \* quantity;", "", s, count=1)
          s=s.replace('pricing.vegThaliInstant',"Number(String(banners.find((b) => b.active && b.thali_key === 'veg')?.thali_rate || '').replace(/[^0-9.]/g, '')) || 0")
          s=s.replace('pricing.eggThaliInstant',"Number(String(banners.find((b) => b.active && b.thali_key === 'egg')?.thali_rate || '').replace(/[^0-9.]/g, '')) || 0")
          s=s.replace('pricing.nonVegThaliInstant',"Number(String(banners.find((b) => b.active && b.thali_key === 'non-veg')?.thali_rate || '').replace(/[^0-9.]/g, '')) || 0")
          if 'pricing.' in s: raise SystemExit('InstantOrderModal still contains legacy pricing references')
          write(p,s)

          # Registration: exact Banner highlight_price, with no duration formula.
          p=Path('src/components/customer/RegistrationModal.tsx'); s=read(p)
          s=s.replace("    pricing,\n", "", 1)
          if "const { banners } = useCms();" not in s:
              s=s.replace("export const RegistrationModal: React.FC = () => {","export const RegistrationModal: React.FC = () => {\n  const { banners } = useCms();",1)
          s=re.sub(r"\n  // Calculate monthly & total price\n.*?\n  const getPackageCode =", "\n  const selectedBanner=banners.find((b)=>b.active&&b.package_key===packageType);\n  const configuredAmount=Number(String(selectedBanner?.highlight_price||'').replace(/[^0-9.]/g,''))||0;\n\n  const getPackageCode =", s, count=1, flags=re.S)
          s=s.replace('baseMonthlyPrice','configuredAmount').replace('calculatedTotal','configuredAmount')
          if 'pricing.' in s: raise SystemExit('RegistrationModal still contains legacy pricing references')
          write(p,s)

          # Renewal: exact Banner highlight_price; duration does not multiply it.
          p=Path('src/components/customer/RenewalModal.tsx'); s=read(p)
          s=s.replace("    pricing,\n", "", 1)
          if "const { banners } = useCms();" not in s:
              if "import { useCms } from '../../cms/CmsContext';" not in s:
                  s=s.replace("import React","import { useCms } from '../../cms/CmsContext';\nimport React",1)
              s=s.replace("export const RenewalModal: React.FC = () => {","export const RenewalModal: React.FC = () => {\n  const { banners } = useCms();",1)
          s=re.sub(r"\n  const basePrice =.*?\n  const totalRenewalAmount = Math\.round\(basePrice \* multiplier \* discountFactor\);", "\n  const selectedBanner=banners.find((b)=>b.active&&b.package_key===activeSub.packageType);\n  const totalRenewalAmount=Number(String(selectedBanner?.highlight_price||'').replace(/[^0-9.]/g,''))||0;", s, count=1, flags=re.S)
          if 'pricing.' in s: raise SystemExit('RenewalModal still contains legacy pricing references')
          write(p,s)

          # Package/hero displays consume AppContext pricing, which is now Banner-projected.
          # Remove only any direct customer pricing source left in these key files.
          for name in ['PackagesSection.tsx','HeroBanner.tsx']:
              p=Path('src/components/customer')/name
              s=read(p)
              if 'pricing.' in s:
                  raise SystemExit(f'{name} still contains a direct legacy pricing reference')

      - name: Test
        run: |
          npm run lint
          npm test
          npm run build

      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: route all customer pricing through banner values [skip banner repair]' || echo 'No source changes to commit'
          git push origin main
