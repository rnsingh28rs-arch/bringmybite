name: Order routing and chef preparation bridge
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/order-routing-bridge.yml'
permissions:
  contents: write
jobs:
  bridge:
    if: github.event.head_commit.message != 'chore: connect manager routing and chef preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved connectivity bridge
        run: python3 scripts/apply-order-bridge.py
      - name: Commit bridge changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/orderStore.ts src/components/panels/ManagerPanel.tsx src/components/panels/ChefPanel.tsx src/components/panels/AdminPanel.tsx supabase/migrations/20260828_order_routing_preparation.sql
          git diff --cached --quiet || git commit -m 'chore: connect manager routing and chef preparation'
          git push
