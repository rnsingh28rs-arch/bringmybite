name: Order routing and chef preparation bridge
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/order-routing-bridge.yml'
permissions:
  contents: write
jobs:
  bridge:
    if: github.event.head_commit.message != 'chore: connect manager routing and chef preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal order connectivity changes
        run: |
          cat > /tmp/bridge.py <<'PYBRIDGE'
from pathlib import Path
root=Path('.')
def edit(path, fn):
 p=root/path; s=p.read_text(); ns=fn(s)
 if ns==s: raise SystemExit(f'NO CHANGE: {path}')
 p.write_text(ns); print('changed',path)
edit('src/utils/orderStore.ts', lambda s: s.replace("  updatedAt: string;\n}", "  updatedAt: string;\n  assignedRole?: string;\n  assignedTo?: string;\n  preparationRequestedAt?: string;\n}").replace("  if (patch.details !== undefined) out.details = patch.details;", "  if (patch.details !== undefined) out.details = patch.details;\n  if (patch.assignedRole !== undefined) out.assigned_role = patch.assignedRole;\n  if (patch.assignedTo !== undefined) out.assigned_to = patch.assignedTo;\n  if (patch.preparationRequestedAt !== undefined) out.preparation_requested_at = patch.preparationRequestedAt;").replace("    updatedAt: row.updated_at ?? row.updatedAt ?? new Date().toISOString()\n", "    updatedAt: row.updated_at ?? row.updatedAt ?? new Date().toISOString(),\n    assignedRole: row.assigned_role ?? row.assignedRole ?? '',\n    assignedTo: row.assigned_to ?? row.assignedTo ?? '',\n    preparationRequestedAt: row.preparation_requested_at ?? row.preparationRequestedAt ?? ''\n"))
Path('supabase/migrations/20260828_order_routing_preparation.sql').write_text("""alter table public.bmb_orders add column if not exists assigned_role text not null default '';\nalter table public.bmb_orders add column if not exists assigned_to text not null default '';\nalter table public.bmb_orders add column if not exists preparation_requested_at timestamptz;\ncreate index if not exists bmb_orders_status_role_idx on public.bmb_orders(status, assigned_role);\nalter table public.bmb_orders replica identity full;\nalter publication supabase_realtime add table public.bmb_orders;\n""")
edit('src/components/panels/ManagerPanel.tsx', lambda s: s.replace("import React, { useState } from 'react';", "import React, { useEffect, useState } from 'react';\nimport { getStoredOrders, updateStoredOrder, StoredOrder } from '../../utils/orderStore';").replace("  const [pricingSuccess, setPricingSuccess] = useState(false);", "  const [pricingSuccess, setPricingSuccess] = useState(false);\n  const [orderRequests, setOrderRequests] = useState<StoredOrder[]>([]);\n  const [orderMessage, setOrderMessage] = useState('');").replace("  const handleSavePricing = async (e: React.FormEvent) => {", "  const loadOrderRequests = async () => setOrderRequests(await getStoredOrders());\n  useEffect(() => { void loadOrderRequests(); const onChange=()=>void loadOrderRequests(); window.addEventListener('bmb-order-request-change', onChange); window.addEventListener('storage', onChange); const t=window.setInterval(()=>void loadOrderRequests(),5000); return()=>{window.removeEventListener('bmb-order-request-change', onChange);window.removeEventListener('storage', onChange);window.clearInterval(t);}; }, []);\n  const routeOrder = async (order: StoredOrder, assignedRole: string) => { await updateStoredOrder(order.id, { assignedRole, assignedTo: assignedRole === 'chef' ? 'Chef Kitchen' : 'Dispatch' }); setOrderMessage(`${order.id} routed to ${assignedRole === 'chef' ? 'Chef Kitchen' : 'Dispatch'}.`); await loadOrderRequests(); setTimeout(()=>setOrderMessage(''),3000); };\n\n  const handleSavePricing = async (e: React.FormEvent) => {") )
p=Path('src/components/panels/ManagerPanel.tsx'); s=p.read_text(); a=s.index("        {/* ========================================================================= */}\n        {/* TAB 3: ORDER ROUTING & GATE DISPATCHES */}"); b=s.index("        {/* ========================================================================= */}\n        {/* TAB 4: CHEF INDENT APPROVALS */}",a)
block='''        {/* ========================================================================= */}\n        {/* TAB 3: ORDER REQUESTS & ROUTING */}\n        {/* ========================================================================= */}\n        {activeTab === 'orders_dispatch' && (\n          <div className="space-y-6 animate-in fade-in duration-200">\n            <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-xs space-y-4">\n              <div className="flex items-center justify-between pb-2 border-b border-gray-100">\n                <div><h3 className="font-bold text-sm text-gray-900 uppercase tracking-wide">Order Requests & Routing ({orderRequests.length})</h3><p className="text-xs text-gray-500 mt-1">Orders are read from the central order queue. Routing only changes assignment; it does not alter the order.</p></div>\n                <div className="flex items-center gap-2">{orderMessage && <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded">✓ {orderMessage}</span>}<button onClick={() => void loadOrderRequests()} className="px-3 py-2 rounded-xl bg-[#124E33] text-white text-xs font-bold">Refresh</button></div>\n              </div>\n              <div className="space-y-3">\n                {orderRequests.length === 0 && <div className="p-8 text-center text-sm text-gray-500">No order requests available.</div>}\n                {orderRequests.map(order => (<div key={order.id} className="border border-gray-200 rounded-xl p-4 flex flex-wrap items-center justify-between gap-3"><div><div className="flex items-center gap-2"><span className="font-mono font-black text-[#124E33]">{order.id}</span><span className="text-[10px] px-2 py-1 rounded-full bg-gray-100 font-bold">{order.kind === 'instant' ? 'Instant Thali' : 'Subscription'}</span><span className="text-[10px] px-2 py-1 rounded-full bg-amber-50 text-amber-800 font-bold">{order.status}</span></div><div className="mt-1 text-sm font-bold">{order.customerName} • {order.planOrMeal}</div><div className="text-xs text-gray-500">₹{order.amount.toLocaleString()} • {order.phone} • Assigned: {order.assignedRole || 'Unassigned'}</div></div><div className="flex gap-2"><button onClick={() => void routeOrder(order,'chef')} className="px-3 py-2 rounded-xl bg-[#C88A24] text-black text-xs font-black">Route to Chef</button><button onClick={() => void routeOrder(order,'dispatch')} className="px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-black">Route to Dispatch</button></div></div>))}\n              </div>\n            </div>\n          </div>\n        )}\n\n'''
p.write_text(s[:a]+block+s[b:]); print('changed Manager routing block')
edit('src/components/panels/ChefPanel.tsx', lambda s: s.replace("import React, { useState } from 'react';", "import React, { useEffect, useState } from 'react';\nimport { getStoredOrders, updateStoredOrder, StoredOrder } from '../../utils/orderStore';").replace("    updateInstantOrderStatus\n", "    updateOrderStatus\n").replace("  const [activeSubPanel, setActiveSubPanel] = useState<'cooking_alerts' | 'ingredient_indent'>('cooking_alerts');", "  const [activeSubPanel, setActiveSubPanel] = useState<'cooking_alerts' | 'ingredient_indent' | 'order_preparation'>('order_preparation');\n  const [preparationOrders, setPreparationOrders] = useState<StoredOrder[]>([]);\n  const [preparationMessage, setPreparationMessage] = useState('');").replace("  const [indentSuccessMsg, setIndentSuccessMsg] = useState('');", "  const [indentSuccessMsg, setIndentSuccessMsg] = useState('');\n  const loadPreparationOrders = async () => { const rows = await getStoredOrders(); setPreparationOrders(rows.filter(o => o.status === 'Preparing' && (!o.assignedRole || o.assignedRole === 'chef'))); };\n  useEffect(() => { void loadPreparationOrders(); const onChange=()=>void loadPreparationOrders(); window.addEventListener('bmb-order-request-change', onChange); window.addEventListener('storage', onChange); const t=window.setInterval(()=>void loadPreparationOrders(),5000); return()=>{window.removeEventListener('bmb-order-request-change', onChange);window.removeEventListener('storage', onChange);window.clearInterval(t);}; }, []);") )
p=Path('src/components/panels/ChefPanel.tsx'); s=p.read_text(); needle='''            <button\n              onClick={() => setActiveSubPanel('ingredient_indent')}'''; idx=s.find(needle); insert='''            <button\n              onClick={() => setActiveSubPanel('order_preparation')}\n              className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${activeSubPanel === 'order_preparation' ? 'bg-[#C88A24] text-black shadow-xs' : 'text-emerald-200 hover:text-white'}`}\n            ><Flame className="w-4 h-4" /><span>Order Preparation ({preparationOrders.length})</span></button>\n\n'''; s=s[:idx]+insert+s[idx:]; marker="        {/* ========================================================================= */}\n        {/* SUB-PANEL 1: COOKING ALERTS"; pos=s.index(marker); panel='''        {/* ORDER PREPARATION REQUESTS */}\n        {activeSubPanel === 'order_preparation' && (<div className="space-y-4 animate-in fade-in duration-200"><div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-xs"><div className="flex items-center justify-between pb-3 border-b border-gray-100"><div><h3 className="font-bold text-base text-gray-900">Order Preparation Requests ({preparationOrders.length})</h3><p className="text-xs text-gray-500 mt-1">Only Admin-approved orders sent to preparation appear here.</p></div><button onClick={() => void loadPreparationOrders()} className="px-3 py-2 rounded-xl bg-[#124E33] text-white text-xs font-bold">Refresh</button></div>{preparationMessage && <div className="mt-3 text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-2 rounded">✓ {preparationMessage}</div>}<div className="mt-4 space-y-3">{preparationOrders.length === 0 && <div className="p-8 text-center text-sm text-gray-500">No preparation requests waiting.</div>}{preparationOrders.map(order => (<div key={order.id} className="border border-amber-200 bg-amber-50/40 rounded-xl p-4 flex flex-wrap items-center justify-between gap-3"><div><div className="font-mono font-black text-[#124E33]">{order.id}</div><div className="font-bold text-gray-900 mt-1">{order.customerName} • {order.planOrMeal}</div><div className="text-xs text-gray-500">{order.phone} • ₹{order.amount.toLocaleString()} • {order.details || 'No special instructions'}</div></div><button onClick={async () => { await updateStoredOrder(order.id,{assignedRole:'chef',assignedTo:'Chef Kitchen'}); setPreparationMessage(`${order.id} is assigned to Chef Kitchen and ready to start.`); await loadPreparationOrders(); setTimeout(()=>setPreparationMessage(''),3000); }} className="px-4 py-2 rounded-xl bg-[#C88A24] text-black text-xs font-black">Start Preparation</button></div>))}</div></div></div>)}\n\n'''; s=s[:pos]+panel+s[pos:]; p.write_text(s); print('changed Chef')
edit('src/components/panels/AdminPanel.tsx', lambda s: s.replace("await updateStoredOrder(order.id, { status: next, paymentStatus });", "await updateStoredOrder(order.id, { status: next, paymentStatus, ...(next === 'Preparing' ? { preparationRequestedAt: new Date().toISOString(), assignedRole: 'chef', assignedTo: 'Chef Kitchen' } : {}) });"))
PYBRIDGE
          python3 /tmp/bridge.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/orderStore.ts src/components/panels/ManagerPanel.tsx src/components/panels/ChefPanel.tsx src/components/panels/AdminPanel.tsx supabase/migrations/20260828_order_routing_preparation.sql
          git diff --cached --quiet || git commit -m 'chore: connect manager routing and chef preparation'
          git push
